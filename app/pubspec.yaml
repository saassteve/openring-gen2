name: ringconn_companion
description: A local-first custom companion app for the RingConn Gen 2.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.8.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  sqlite3: ^3.3.0
  path_provider: ^2.1.6
  provider: ^6.1.5
  share_plus: ^13.3.1
  ring_protocol:
    path: packages/ring_protocol
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.3
flutter:
  uses-material-design: true
